name: Update Latest Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update projects in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          USERNAME = "Yrashka200"
          README = "README.md"

          url = (
              f"https://api.github.com/users/{USERNAME}/repos"
              "?sort=updated&direction=desc&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          # Только мои репозитории, без fork
          repos = [
              repo for repo in repos
              if not repo["fork"]
              and repo["name"].lower() != USERNAME.lower()
          ]

          # Последние 6 проектов
          repos = repos[:6]

          projects = []

          for repo in repos:
              name = repo["name"]
              description = repo["description"] or "No description"
              language = repo["language"]
              stars = repo["stargazers_count"]
              forks = repo["forks_count"]
              link = repo["html_url"]

              info = description

              if language:
                  info += f" • `{language}`"

              info += f" • ⭐ {stars} • 🍴 {forks}"

              projects.append(
                  f"- 🚀 **[{name}]({link})** — {info}"
              )

          new_projects = "\n".join(projects)

          with open(README, "r", encoding="utf-8") as file:
              content = file.read()

          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          pattern = re.escape(start) + r".*?" + re.escape(end)

          replacement = (
              start
              + "\n\n"
              + new_projects
              + "\n\n"
              + end
          )

          updated = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL,
          )

          if updated == content:
              print("Project markers were not found.")
              raise SystemExit(1)

          with open(README, "w", encoding="utf-8") as file:
              file.write(updated)

          print("README updated successfully.")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update latest projects"
            git push
          fi
