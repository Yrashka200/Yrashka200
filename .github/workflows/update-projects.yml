name: Update Latest Projects

on:
schedule:
- cron: "0 12 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update-projects:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Update projects
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      python <<'PY'
      import json
      import os
      import re
      import urllib.request

      username = "Yrashka200"

      url = (
          f"https://api.github.com/users/{username}/repos"
          "?sort=updated&direction=desc&per_page=100"
      )

      request = urllib.request.Request(
          url,
          headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          },
      )

      with urllib.request.urlopen(request) as response:
          repos = json.load(response)

      # Exclude forks and the profile repository itself.
      repos = [
          repo for repo in repos
          if not repo["fork"]
          and repo["name"].lower() != username.lower()
      ]

      # Take the 6 most recently updated repositories.
      repos = repos[:6]

      lines = []

      for repo in repos:
          name = repo["name"]
          description = repo["description"] or "No description provided."
          html_url = repo["html_url"]

          language = repo["language"]

          if language:
              description += f" • `{language}`"

          lines.append(
              f"- 🚀 **[{name}]({html_url})** — {description}"
          )

      projects = "\n".join(lines)

      readme_path = "README.md"

      with open(readme_path, "r", encoding="utf-8") as file:
          readme = file.read()

      pattern = r"(<!-- PROJECTS:START -->).*?(<!-- PROJECTS:END -->)"

      replacement = (
          r"\1\n\n"
          + projects
          + r"\n\n\2"
      )

      updated_readme = re.sub(
          pattern,
          replacement,
          readme,
          flags=re.DOTALL,
      )

      with open(readme_path, "w", encoding="utf-8") as file:
          file.write(updated_readme)

      print("Projects updated successfully.")
      PY

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add README.md

      if git diff --cached --quiet; then
        echo "No changes."
      else
        git commit -m "chore: update latest projects"
        git push
      fi
