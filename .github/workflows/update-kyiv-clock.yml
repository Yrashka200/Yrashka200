name: Update Kyiv Clock

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: update-kyiv-clock

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Kyiv clock widget
        run: python scripts/update_profile_widgets.py clock

      - name: Publish clock to profile-widgets branch
        run: |
          cp assets/kyiv-clock.svg "$RUNNER_TEMP/kyiv-clock.svg"
          git switch --orphan profile-widgets
          git rm -rf .
          mkdir -p assets
          cp "$RUNNER_TEMP/kyiv-clock.svg" assets/kyiv-clock.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kyiv-clock.svg
          git commit -m "chore: refresh Kyiv clock widget"
          git push --force origin profile-widgets
